<form class="form">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="40"
    height="40"
    viewBox="0 0 40 40"
    fill="none"
  >
    <circle cx="20" cy="20" r="20" fill="#4F6D7A" />
  </svg>
  <h3 class="form-heading">Contact Details</h3>
  <div class="vertical-line"></div>
  <div class="form-section">
    <h4 class="section-header">Personal Information</h4>
    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      name="fullName"
      placeholder="Enter your full name"
      required
    />
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required />
    <label for="license">Driver License Number</label>
    <input
      type="text"
      id="license"
      name="license"
      placeholder="Enter your full driver's license number"
      required
    />
  </div>
  <div class="form-section">
    <h4 class="section-header">Contact Details</h4>
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="sample@email.com"
      required
    />
    <label for="phone">Phone Number</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="XXX-XXX-XXXX"
      required
    />
  </div>
  <div class="form-section">
    <h4 class="section-header">Mailing Address</h4>
    <label for="mailStreet">Street Address</label>
    <input
      type="text"
      id="mailStreet"
      name="mailStreet"
      placeholder="e.g. 123 Main St or 456 Elm Ave Apt 2B"
      required
    />

    <div class="row">
      <div>
        <label for="mailCity">City</label>
        <input
          type="text"
          id="mailCity"
          name="mailCity"
          placeholder="City of residence"
          required
        />
      </div>
      <div>
        <label for="mailState">State</label>
        <input
          type="text"
          id="mailState"
          name="mailState"
          placeholder="XX"
          required
        />
      </div>
      <div>
        <label for="mailZip">ZIP Code</label>
        <input
          type="text"
          id="mailZip"
          name="mailZip"
          placeholder="5-digit ZIP code"
          required
        />
      </div>
    </div>
  </div>
  <div class="form-section">
    <h4 class="section-header">Physical Address</h4>

    <label for="physStreet">Street Address</label>
    <input
      type="text"
      id="physStreet"
      name="physStreet"
      placeholder="e.g. 123 Main St or 456 Elm Ave Apt 2B"
      required
    />

    <div class="row">
      <div>
        <label for="physCity">City</label>
        <input
          type="text"
          id="physCity"
          name="physCity"
          placeholder="City of residence"
          required
        />
      </div>
      <div>
        <label for="physState">State</label>
        <input
          type="text"
          id="physState"
          name="physState"
          placeholder="XX"
          required
        />
      </div>
      <div>
        <label for="physZip">ZIP Code</label>
        <input
          type="text"
          id="physZip"
          name="physZip"
          placeholder="5-digit ZIP code"
          required
        />
      </div>
    </div>
  </div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="40"
    height="40"
    viewBox="0 0 40 40"
    fill="none"
  >
    <circle cx="20" cy="20" r="20" fill="#4F6D7A" />
  </svg>
  <h3 class="form-heading">Income & References</h3>
  <div class="vertical-line"></div>
  <div class="form-section">
    <h4 class="section-header">Income Information</h4>

    <label for="annualIncome">What is your estimated annual income?</label>
    <input
      type="text"
      id="annualIncome"
      name="annualIncome"
      placeholder="Include income from all sources. An estimate is fine."
      required
    />

    <label for="incomeSource">What is your primary source of income?</label>
    <input
      type="text"
      id="incomeSource"
      name="incomeSource"
      placeholder="Ex. employment, self-employment"
      required
    />
  </div>
  <div class="form-section">
    <h4 class="section-header">References</h4>

    <label for="reference1">Reference Name 1</label>
    <input
      type="text"
      id="reference1"
      name="reference1"
      placeholder="Full Name of Reference"
      required
    />

    <label for="referencephone1">Reference Phone Number 1</label>
    <input
      type="tel"
      id="referencephone1"
      name="referencephone1"
      placeholder="XXX-XXX-XXXX"
      required
    />

    <label for="reference2">Reference Name 2</label>
    <input
      type="text"
      id="reference2"
      name="reference2"
      placeholder="Full Name of Reference"
      required
    />

    <label for="referencephone2">Reference Phone Number 2</label>
    <input
      type="tel"
      id="referencephone2"
      name="referencephone2"
      placeholder="XXX-XXX-XXXX"
      required
    />
    <label for="reference3">Reference Name 3</label>
    <input
      type="text"
      id="reference3"
      name="reference3"
      placeholder="Full Name of Reference"
      required
    />

    <label for="referencephone3">Reference Phone Number 3</label>
    <input
      type="tel"
      id="referencephone3"
      name="referencephone3"
      placeholder="XXX-XXX-XXXX"
      required
    />
  </div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="40"
    height="40"
    viewBox="0 0 40 40"
    fill="none"
  >
    <circle cx="20" cy="20" r="20" fill="#4F6D7A" />
  </svg>
  <h3 class="form-heading">Confirmation</h3>
  <div class="vertical-line"></div>
  <div class="form-section">
    <label>
      <input type="checkbox" name="newsletter" checked />
      <strong>Yes, sign me up for the IWAE newsletter!</strong><br />
      <small style="color: #777">
        Get exclusive deals and be the first to know about new products, promos,
        and more.
      </small>
    </label>
    <button
      type="submit"
      style="
        background-color: #4a6a75;
        color: white;
        padding: 0.75rem 2rem;
        font-weight: bold;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
      "
    >
      Submit Application
    </button>
  </div>
</form>
